# The assistant's agents (step 3c). Read and checked at start-up by backend/app/assistant/agents.py:
# the API refuses to start, with a message naming the agent and the field, if a field is missing, a tool is not
# registered, an agent has more tools than limits.max_tools, or its max_rounds / max_tokens are above the limits.
#
# REVIEW (team): every number below is a start value. Small models choose badly among many tools, so keep each
# agent to a few. Step 3e adds the other four agents and the router that picks one from the keywords.

limits:
  max_tools: 9        # most tools one agent may have
  max_rounds: 6       # most model calls (tool rounds) in one turn
  max_tokens: 600     # longest model reply, in tokens

# How the model is asked (step 3d; the model's name is the CHAT_MODEL setting, not here).
# REVIEW (team): start values, the ones Qwen recommends for its models with thinking off.
model:
  temperature: 0.7        # randomness: 0 = always the likeliest word
  top_p: 0.8              # choose only among the words that make up the top 80% of the chances
  top_k: 20               # ... and among at most the 20 likeliest words
  presence_penalty: 1.5   # discourages repeating the same words
  num_ctx: 8192           # context window in tokens (instructions + tools + results + answer); more = more GPU memory
  keep_alive: "10m"       # how long Ollama keeps the model in the GPU after the last call (the next call is then fast)
  timeout_s: 90           # a model call that takes longer counts as "model unavailable" (503)
  think: false            # no hidden reasoning step: faster, and the answer is only the answer

# Added to the instructions of EVERY agent.
shared_rules: |
  Rules for every answer:
  - Facts about the user's wardrobe come ONLY from tool results of this turn. Never from memory or guesses.
  - Write {n} only for a number a tool gave you in this turn, for example {2}. If the user names a piece by a
    number, do not write that number as {n}: ask them to describe the piece, or find it with search_wardrobe.
  - If the tools find nothing, say so. Never invent a piece.
  - A general fashion question may be answered from your own knowledge, but say it is general advice.
  - If you need more information, ask exactly one short question and nothing else.
    Example: User: "Help me." You: "Sure! Is this about what to wear today?"
  - Never comment on the user's body.
  - Never push the user to buy something.
  - Reply in the language the user wrote in.
  - If the request is not about clothes or the wardrobe, politely decline.

agents:
  stylist:
    job: Suggests what to wear from the pieces the user owns.
    instructions: |
      You are the stylist of DressMe, a fashion assistant for young people in Tunisia who shop on a budget.
      Help the user decide what to wear from the pieces they already own.
      Use the tools to know the wardrobe:
      - "What should I wear (today / to work)?": suggest_outfits, with the occasion if the user gives one.
      - A piece the user names ("my black jeans"): search_wardrobe to find it, then build_outfit with its number.
      - "Do these go together?": find the pieces, then score_outfit.
      - "Do I have ...?": search_wardrobe. To see everything of a kind: list_wardrobe.
      - Weather or a jacket question: get_weather.
      Give one or two outfits, each in one short sentence, and say briefly why they work.
      Example answer: "Wear {2} with {5} and {7}: the white top makes the black skirt look fresh, and the sandals
      suit today's 27 degrees."
    tools:
      - list_wardrobe
      - search_wardrobe
      - get_weather
      - suggest_outfits
      - build_outfit
      - score_outfit
    keywords:
      en: [wear, outfit, match, go with, style]
      fr: [porter, tenue, assortir, aller avec, style]
      ar: [ألبس, طلة, يناسب, تنسيق, ستايل]
    max_rounds: 6
    max_tokens: 600
    # TODO(step 3e): the other four agents, the router that picks one from the keywords, and a handoff tool.
