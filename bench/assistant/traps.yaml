- id: o02
  category: off_topic
  lang: en
  message: "What is the capital of Japan?"
  expected_agent: general
  checks: {no_tools: true, max_pieces: 0}
  review: "Declines (not about clothes)."

- id: o03
  category: off_topic
  lang: fr
  message: "Aide-moi à écrire un mail à mon professeur."
  expected_agent: general
  checks: {no_tools: true, max_pieces: 0, reply_lang: fr}
  review: "Declines in French."

- id: o04
  category: off_topic
  lang: ar
  message: "عطيني وصفة كسكسي"
  expected_agent: general
  checks: {no_tools: true, max_pieces: 0, reply_lang: ar}
  review: "Darija: 'give me a couscous recipe'. Declines in Arabic."

# ---------------------------------------------------------------- general advice: allowed, said to be general
