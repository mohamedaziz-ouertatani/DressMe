- id: x06
  category: other_agent
  lang: en
  message: "Which of my pieces are too similar?"
  expected_agent: wardrobe_analyst
  checks: {tools_any: [near_twins, wardrobe_insights], reply_lang: en}
  review: "Names pairs the tool listed, or says there are none; invents no pair."

- id: x07
  category: other_agent
  lang: en
  message: "How balanced is my wardrobe?"
  expected_agent: wardrobe_analyst
  checks: {tools_any: [wardrobe_insights], reply_lang: en}
  review: "Uses the counts the tool gave; invents no percentage."

# ---------------------------------------------------------------- explainer (step 3e.3)
- id: e01
  category: other_agent
  lang: en
  message: "Why did my pink jacket and black skirt get that score?"
  expected_agent: explainer
  checks: {tools_any: [score_outfit, explain_outfit], min_pieces: 2, reply_lang: en}
  review: "Finds both pieces, gives the score the tool gave and the reasons in plain words; invents no number."

- id: e02
  category: other_agent
  lang: en
  message: "Which piece weakens my pink jacket and black skirt outfit the most?"
  expected_agent: explainer
  checks: {tools_any: [explain_outfit], min_pieces: 2, reply_lang: en}
  review: "Names the weakest piece and the swap explain_outfit gave, or says neither piece is clearly weak."

- id: e03
  category: other_agent
  lang: en
  message: "How does the outfit scoring work?"
  expected_agent: explainer
  checks: {tools_any: [how_scoring_works], max_pieces: 0, reply_lang: en}
  review: "Four parts with the shares the tool gave (style 35, colour 30, structure 20, pattern 15); invents none."

# ---------------------------------------------------------------- seller (step 3e.3)
# No price model file on the development PC yet, so price_estimate answers no_price_model: the right answer says
# it cannot estimate a price. With the model file, a range in TND is right.
- id: se01
  category: other_agent
  lang: en
  message: "How much could I ask for my pink jacket second-hand?"
  expected_agent: seller
  checks: {tools_any: [price_estimate], reply_lang: en}
  review: "Finds the jacket and asks the price tool. Gives a RANGE the tool gave, or says it cannot estimate; never a made-up price."

- id: se02
  category: other_agent
  lang: en
  message: "Which of my pieces look almost the same, so I could sell one?"
  expected_agent: seller
  checks: {tools_any: [near_twins], reply_lang: en}
  review: "Names only the pairs near_twins listed, or says there are none; does not push the user to sell."

- id: se03
  category: other_agent
  lang: en
  message: "What could I sell to make some space?"
  expected_agent: seller
  checks: {tools_any: [near_twins, list_wardrobe, search_wardrobe], reply_lang: en}
  review: "Suggests pieces from the tools (twins, unused ones), never invents one; leaves the decision to the user."
