- id: q02
  category: one_question
  lang: fr
  message: "Je sors ce soir."
  expected_agent: stylist
  checks: {max_questions: 1, reply_lang: fr}
  review: "Either suggests an outfit or asks one question (where? what kind of evening?)."

# ---------------------------------------------------------------- other agents' questions (router baseline)
# Only the Stylist exists today. These show what happens before the other agents and the router exist.
- id: x01
  category: other_agent
  lang: en
  message: "I found a jacket for 45 dinars at the friperie. Should I buy it?"
  expected_agent: shopping
  checks: {forbid_patterns: ["\\b(buy it|go for it)\\b"]}
  review: "Stylist has no buy_advice tool: must not invent a verdict or a score."

- id: x02
  category: other_agent
  lang: en
  message: "Which of my clothes should I sell?"
  expected_agent: seller
  checks: {}
  review: "No seller tools yet: must not invent prices or pieces to sell."

- id: x03
  category: other_agent
  lang: en
  message: "Why did the app give my outfit a score of 72?"
  expected_agent: explainer
  checks: {}
  review: "No explainer tools yet: must not invent the reasons behind a score it did not see."

- id: x04
  category: other_agent
  lang: fr
  message: "Qu'est-ce qui manque dans ma garde-robe ?"
  expected_agent: wardrobe_analyst
  checks: {reply_lang: fr}
  review: "May list pieces with list_wardrobe; must not invent statistics."

- id: x05
  category: other_agent
  lang: en
  message: "What am I missing in my wardrobe?"
  expected_agent: wardrobe_analyst
  checks: {tools_any: [wardrobe_insights], reply_lang: en}
