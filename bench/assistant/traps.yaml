  lang: en
  message: "Hi!"
  expected_agent: general
  checks: {no_tools: true, max_pieces: 0, reply_lang: en}
  review: "A short greeting and what it can do."

- id: s02
  category: small_talk
  lang: fr
  message: "Merci beaucoup !"
  expected_agent: general
  checks: {no_tools: true, max_pieces: 0, reply_lang: fr}
